<app-create-user-form (createUserOutput)="createUser($event)"></app-create-user-form>

<div class="header-users">
  <div class="header-users__items" *ngFor="let user of users$ | async">
    <app-user-card 
      [user]="user"
      (deleteUser)="deleteUsers($event)"
      (editUser)="editUser($event)">
    </app-user-card>
  </div>
</div>

<button mat-mini-fab class="button" (click)="openCreateUserModal()">
  <mat-icon>add</mat-icon> 
</button>
